name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint (ruff + pyright)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.13"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dev dependencies only (no Drake/PyTorch for lint)
        run: uv sync --only-group dev

      - name: ruff check
        run: uv run ruff check src/ tests/

      - name: pyright
        run: uv run pyright

  test:
    name: Test (pytest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.13"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install all dependencies
        run: uv sync

      - name: pytest
        run: uv run pytest -x --tb=short
