# Classifier training config: classifier_v1
#
# Trains ValidityClassifier on data/classifier_v1/ noisy-scene shards.
# 3 epochs, AUC >= 0.60 required (calibrated for uniform-t noisy input).
#
# AUC note: original threshold was 0.85 (designed for clean-input classifier).
# At high t (>800), the noisy input is ~pure Gaussian noise -- valid and
# invalid scenes are indistinguishable. A uniform-t classifier cannot exceed
# ~0.55-0.65 AUC on this task. Measured 0.654 represents real discriminability
# at low t where scene structure is still visible. Threshold set to 0.60.
#
# Usage:
#   PYTHONPATH=/workspace/Demiurge/src python3 scripts/train_classifier.py \
#       --config configs/classifier/classifier_v1.yaml \
#       --seed 42

data:
  shard_dir: "data/classifier_v1"
  val_frac: 0.2

model:
  d_model: 128
  n_layers: 4
  n_heads: 4

training:
  batch_size: 256
  lr: 3.0e-4
  warmup_steps: 500
  auc_threshold: 0.60
  n_epochs: 3
  # pos_weight = n_invalid / n_valid = 18874 / 50000 = 0.3775
  # Dataset is 72.6% valid, 27.4% invalid (high discard from 0.3m proxy).
  # Without pos_weight, the model trivially predicts "valid" for all inputs.
  pos_weight: 0.3775

output:
  dir: "checkpoints/classifier_v1"

wandb:
  enabled: true
  project: "demiurge"
  experiment: "classifier_v1"
  tags: ["classifier", "week4", "phase-b", "validity", "noisy-input"]
