# Production dataset configuration for Demiurge v1.
#
# Pass to generate_dataset.py via --config:
#   uv run python scripts/generate_dataset.py --config configs/dataset/v1.yaml --seed 42
#
# Override individual fields from the CLI:
#   ... --override output_dir=data/v1_test target_n=1000

# --- Decision record ---
# 8-vocab profile (seed=0, 500 attempts): 13.2% overall acceptance.
# 12-vocab profile (seed=0, 500 attempts, after dropping 4 high-volume entries):
#   [results TBD -- see re-profile run before cloud launch]
#
# Cloud target: Hetzner CCX43 (16 dedicated AMD cores, 64 GB RAM, ~$0.21/hr).
# Worker count: 15 (16 cores minus 1 reserved for OS and writer process).
# Writer bottleneck: single-threaded tar-write stream; past ~15 workers,
# throughput degrades due to context-switching and cache thrashing.
# CCX43 vs CCX33 decision: CCX43 halves wall-clock at negligible cost delta
# (~$3.15 vs ~$3.00 for 50k scenes). CCX33 documented as fallback in docs/cloud_run.md.
#
# Vocab: 12-object set (IDs 0-11). IDs 12-15 dropped; see validator_profile.md.
# See artifacts/validator_profile.md for full measurement record.

# --- Target ---
target_n: 50000
output_dir: "data/v1"

# --- Template mix (must sum to 1.0) ---
mix:
  tabletop_reach: 0.40
  cluttered_pick: 0.30
  obstacle_avoidance: 0.30

# --- Validator ---
rrt_budget_s: 2.0       # BiRRT wall-clock budget per scene (seconds)
                        # 2s vs 5s: 0.8pp acceptance penalty, 1.8x throughput gain

# --- Writer ---
shard_size_mb: 500      # Maximum size of each .tar shard

# --- Generation ---
num_workers: 15         # ProcessPoolExecutor workers on CCX43 (16 cores, 1 reserved for OS+writer)
                        # Writer is single-threaded tar; >15 workers causes context-switch thrash
batch_size: 64          # Candidates sampled and dispatched per round
# Hard stop: if total attempts exceed target_n * max_attempts_multiplier, halt with error.
max_attempts_multiplier: 10

# --- W&B ---
wandb:
  enabled: false        # Set to true for production; requires WANDB_API_KEY
  project: "demiurge"
  entity: null          # null = use default entity from wandb login
  tags: ["data", "v1", "50k", "2s_budget", "12vocab", "ccx43"]
