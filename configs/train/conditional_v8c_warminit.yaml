# Training configuration: conditional_v8c_warminit -- Warm-Init 49M Smoke Test
#
# Week 5, Phase A (smoke). Tests warm-init strategy: load the padded-v7 checkpoint
# built by scripts/build_warminit_v8c.py, then fine-tune at 49M.
#
# Strategy: v7 checkpoint (d_model=256, n_layers=6) is padded to d_model=384
# and extended to n_layers=16 by scripts/build_warminit_v8c.py. For each
# parameter in the v8c architecture:
#   - If the key exists in v7 AND shapes match after padding: copy padded weights.
#   - New layers (6-15): random init (orthogonal for attn, standard for FFN).
#   - Expanded d_model dims (256->384 in projections): first 256 from v7, last
#     128 zero-initialized.
#
# The trainer's warm_init_from loads the padded checkpoint as a plain state dict
# and applies exact shape-match copy. The build script pre-pads so shapes match.
#
# Why this should work: v7 already learned to separate slots in d_model=256 space.
# The padded weights preserve that geometry in the first 256 dims. The new 128 dims
# and 10 new layers learn on top of an already-valid geometry prior.
#
# LR: 3e-5 (1/5 of v8b's 1.5e-4) -- warm-init is sensitive to high LR which
# can overwrite the geometry prior in the first few steps.
# Warmup: 2000 steps (shorter: model is already well-initialized).
#
# Usage (smoke test on pod):
#   python3 -u scripts/build_warminit_v8c.py  # build padded checkpoint first
#   PYTHONPATH=/workspace/Demiurge/src python3 -u scripts/train.py \
#     --config configs/train/conditional_v8c_warminit.yaml \
#     --override training.max_steps=2000 \
#     --seed 42 2>&1 | tee logs/v8c_wi_smoke.log

text_conditioning: true

model:
  n_layers: 16
  d_model: 384
  n_heads: 6
  ffn_mult: 4
  dropout: 0.1
  use_type_grad_isolation: true
  use_slot_id_embed: false       # no slot-ID embed: v7 prior provides separation

diffusion:
  T: 1000
  ddim_steps: 50

training:
  batch_size: 64
  lr: 3.0e-5                     # low LR to preserve warm-init geometry prior
  warmup_steps: 2000             # short warmup: model already initialized
  max_steps: 200000
  grad_clip: 1.0
  gradient_accumulation: 1
  ema_decay: 0.9999
  checkpoint_steps: 10000
  val_every_epochs: 999999
  val_n_scenes: 0
  dtype: "float32"
  use_class_balanced_sampler: true
  weighted_sampling: false
  class_weights: [0.508274, 0.509557, 0.524349, 0.610689, 0.576833, 0.614267, 0.649812, 0.540713, 0.785170, 0.674344, 0.658182, 0.717809, 5.630001]

  cfg_dropout: 0.15
  use_discrete_type_diffusion: true

  # warm_init_from: the padded checkpoint produced by build_warminit_v8c.py
  # The trainer copies matching keys by exact shape; all v8c keys have
  # been pre-padded to 384 dims so they match.
  warm_init_from: checkpoints/conditional_v8c_warminit/init.pt

  log_every_steps: 10

loss:
  pose_xyz: 1.0
  pose_rot: 1.0
  scale: 0.7
  type_ce: 1.0
  presence_bce: 1.0
  slot_diversity: 0.0            # not needed: warm-init already separates slots

dataset:
  path: "data/v1"
  hash: "4b673befb672690802a87c3f31cdbe2ed0308bdb9df3df27eb261568a6d66d67"
  held_out_per_template: 100
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

output:
  dir: "checkpoints/conditional_v8c_warminit"

wandb:
  enabled: true
  project: "demiurge"
  experiment: "conditional_v8c_warminit"
  name: "conditional_v8c_warminit"
  tags: ["model", "week5", "conditional", "d384", "v8c", "49M",
         "warm-init", "padded-v7", "from-v7", "smoke-test"]
