# Large training config -- d_model=512 (~35M params).
#
# USE ONLY if unconditional validity rate is below 0.4 at end of
# baseline training. Promote from baseline.yaml by swapping this config.
#
# Inherits all other fields from baseline.yaml except model and output.

model:
  n_layers: 6
  d_model: 512
  n_heads: 8
  ffn_mult: 4
  dropout: 0.1

diffusion:
  T: 1000
  ddim_steps: 50

training:
  batch_size: 64    # Reduced from 128 to fit 512-dim model on 24 GB VRAM
  lr: 3.0e-4
  warmup_steps: 1000
  max_steps: 100000
  grad_clip: 1.0
  gradient_accumulation: 2   # Effective batch = 128 via accumulation
  ema_decay: 0.9999
  checkpoint_steps: 5000
  val_every_epochs: 10
  val_n_scenes: 100
  dtype: "bfloat16"
  weighted_sampling: true

loss:
  pose_xyz: 1.0
  pose_rot: 1.0
  scale: 0.5
  type_ce: 0.1
  presence_bce: 0.05

dataset:
  path: "data/v1"
  hash: "4b673befb672690802a87c3f31cdbe2ed0308bdb9df3df27eb261568a6d66d67"
  held_out_per_template: 100
  num_workers: 4

output:
  dir: "checkpoints/unconditional_v1_large"

wandb:
  enabled: true
  project: "demiurge"
  experiment: "unconditional_v1_large"
  tags: ["model", "week3", "unconditional", "d512", "50k", "large"]
