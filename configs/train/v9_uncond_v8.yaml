# v8: Resume from v7 step 140k to the full 200k budget.
#
# v7 was killed at 140k/200k while loss was still descending (-0.010/epoch).
# Stable_rest is the primary validity bottleneck (5% pass rate at 140k) --
# geometry learning is not yet converged.
#
# Changes vs v7:
#   - pose_rot: 1.0 -> 2.0  (equalize per-channel gradient: rot has 6 dims vs 3 for xyz)
#   - slot_diversity: 0.0   (NOT enabled -- cosine loss is wrong signal for spatial collapse)
#   - output dir: v9_uncond_v8  (warm-init from v7 latest.pt)
#   - run_name: v8_resume_rot2  (fix wandb naming bug)
#
# slot_diversity audit finding: loss penalises cosine-direction alignment, not spatial spread.
# v7's actual issue is x_std=0.628 vs target 1.0 (spatial, not directional).
# Setting slot_diversity>0 adds noise with no signal for this failure mode.

model:
  d_model: 384
  n_layers: 16
  n_heads: 8
  ffn_mult: 4
  dropout: 0.0
  use_type_grad_isolation: false
  use_slot_id_embed: true
  use_discrete_type_diffusion: true

diffusion:
  T: 1000
  ddim_steps: 50
  prediction_type: v
  zero_terminal_snr: true

training:
  max_steps: 200000
  batch_size: 64
  lr: 3e-4
  warmup_steps: 2000
  ema_decay: 0.9999
  checkpoint_steps: 10000
  val_every_epochs: 999
  val_n_scenes: 0
  grad_clip: 1.0
  gradient_accumulation: 1
  use_discrete_type_diffusion: true
  weighted_sampling: false
  log_every_steps: 100
  cfg_dropout: 0.0
  warm_init_from: checkpoints/v9_uncond_v7/latest.pt

loss:
  pose_xyz: 1.0
  pose_rot: 2.0
  scale: 1.0
  type_ce: 1.0
  presence_bce: 1.5
  slot_diversity: 0.0

output:
  dir: checkpoints/v9_uncond_v8

dataset:
  path: data/v1

wandb:
  enabled: true
  project: demiurge
  entity: galanafai-self
  run_name: v8_resume_rot2
