[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demiurge"
version = "0.1.0"
description = "Conditional diffusion model for physically valid 6-DoF tabletop scene generation, validated through Drake."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Drake and PyTorch are pinned exactly per AGENTS.md tooling discipline.
    # drake 1.52.0+ dropped the Python 3.11 wheel; 1.51.1 is the latest cp311 release.
    "drake==1.51.1",
    "torch==2.7.1",
    # Remaining runtime dependencies use compatible-release pins.
    "numpy>=2.4.0,<3.0.0",
    "einops==0.8.2",
    # sentence-transformers: pin to last 4.x; 5.x is a breaking API change.
    # Update the pin when implementing Layer 4 (diffusion model).
    "sentence-transformers==4.1.0",
    "hydra-core==1.3.2",
    "webdataset>=1.0.2",
]

[dependency-groups]
dev = [
    "ruff==0.9.9",
    "pyright==1.1.409",
    "pytest==9.0.3",
    "pytest-xdist==3.8.0",
]

[tool.hatch.build.targets.wheel]
# Each subdirectory of src/ is installed as an independent top-level package.
packages = [
    "src/scene",
    "src/validator",
    "src/data",
    "src/model",
    "src/guidance",
    "src/eval",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["scene", "validator", "data", "model", "guidance", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short"
markers = [
    "slow: marks tests as slow (full Drake pipeline, may take > 10 s per test)",
]
